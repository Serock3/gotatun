[workspace]
resolver = "2"
members = ["gotatun-hotpath", "gotatun-download", "gotatun-upload", "throughput-common"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MPL-2.0"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22.1"
benchy-lib = { path = "../../benchy/benchy-lib" }
benchy-runner = { path = "../../benchy/benchy-runner" }
bytes = "1.11"
# Keep the profiler report parser and producer on the same version.
hotpath = { version = "=0.30.1", default-features = false }
zerocopy = { version = "0.8", features = ["std"] }
clap = { version = "4.5", features = ["derive", "env"] }
gotatun = { path = "../gotatun", default-features = false, features = ["device", "aws-lc-rs", "tun"] }
hex = "0.4"
ipnetwork = "0.21"
rand = "0.9"
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
