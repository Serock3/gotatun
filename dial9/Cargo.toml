[workspace]

[package]
name = "gotatun-dial9"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MPL-2.0"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dial9 = { package = "dial9-tokio-telemetry", version = "=0.5.0-rc0", features = [
    "cpu-profiling",
    "memory-profiling",
    "process-resource",
    "tracing-layer",
] }
dial9-trace-format = "=0.5.0-rc0"
# The rc0 trace-format renames its derive types; newer 0.5.x derives generate incompatible
# code inside the rc0 crates. Pin until the dial9 crates move past rc0 together.
dial9-trace-format-derive = "=0.5.0-rc0"
anyhow = "1.0"
benchy-runner = { path = "../../benchy/benchy-runner" }
gotatun = { path = "../gotatun", default-features = false, features = ["device", "aws-lc-rs", "tun"] }
hex = "0.4"
ipnetwork = "0.21.1"
libc = "0.2.180"
rand = "0.9"
serde_json = "1.0"
tokio = { version = "1.43.0", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[profile.profiling]
inherits = "release"
debug = 2
strip = false
