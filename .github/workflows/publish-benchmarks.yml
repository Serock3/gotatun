name: Publish benchmarks

on:
  workflow_run:
    workflows: [Benchmarks]
    types: [completed]

permissions: {}

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: read
      checks: write
      pull-requests: write
    uses: Serock3/benchy/.github/workflows/publish-benchmarks.yml@afe6ad3777db316cb4f4dff768429ac2bac40733
    with:
      bencher-project: ${{ vars.BENCHER_PROJECT }}
      # Fresh AWS-LC/kernel-peer baseline; historical calibration is in benchmarks/DEMO.md.
      bencher-testbed: alice-bob-kernel-peer-v1
      # iperf CPU stays diagnostic because it scales with traffic volume.
      threshold-policy: >-
        {"minimum_samples":5,"maximum_samples":10,"measures":{
          "throughput-network":{"lower":0.02},
          "cpu-gotatun":{"upper":0.10},
          "time":{"upper":0.10},
          "allocated":{"upper":0.05},
          "lock-wait":{"upper":0.30},
          "lock-hold":{"upper":0.30}}}
    secrets:
      BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
