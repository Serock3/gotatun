[workspace]

[package]
name = "gotatun-buffered-download"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MPL-2.0"
publish = false

[dependencies]
anyhow = "1.0"
benchy-runner = { path = "../../../benchy/benchy-runner" }
bytes = "1.11"
clap = { version = "4.5", features = ["derive"] }
gotatun = { path = "../../gotatun", default-features = false, features = ["device", "aws-lc-rs", "tun"] }
hex = "0.4"
ipnetwork = "0.21"
libc = "0.2"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
zerocopy = "0.8"
